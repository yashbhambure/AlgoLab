name: AlgoLab Continuous Integration

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-qa:
    name: Backend Test Suite & Linting
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Database Migrations
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          python -m alembic upgrade head

      - name: Run Backend Pytest Suite
        env:
          PYTHONPATH: .
          DATABASE_URL: "sqlite:///./ci_test.db"
        run: |
          pytest tests -v --durations=10

  frontend-qa:
    name: Frontend Typecheck, Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run Oxlint Code Quality Check
        run: npm run lint

      - name: Run TypeScript Verification & Production Build
        run: npm run build
