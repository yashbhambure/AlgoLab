services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: algolab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=sqlite:///./algorithm_benchmark.db
      - SECRET_KEY=algolab-secure-production-key-change-in-real-deployment-2026
      - BENCHMARK_TIMEOUT_SECONDS=10.0
      - BACKEND_CORS_ORIGINS=["http://localhost:3000","http://localhost:80","http://localhost:5173","*"]
    volumes:
      - algolab_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: algolab-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  algolab_data:
